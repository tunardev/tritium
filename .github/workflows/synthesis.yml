name: synthesis

on:
  workflow_dispatch:

jobs:
  ecp5:
    strategy:
      matrix:
        variant: [ternary, int8]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: hardware
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
      - run: make synthesis VARIANT=${{ matrix.variant }}
      - run: make timing VARIANT=${{ matrix.variant }} NEXTPNR="nextpnr-ecp5 --threads 4"
      - run: grep -E "Max frequency|TRELLIS_COMB:|DP16KD:|MULT18X18D:" build/${{ matrix.variant }}/nextpnr.log
      - uses: actions/upload-artifact@v7
        with:
          name: ecp5-${{ matrix.variant }}
          path: |
            hardware/build/${{ matrix.variant }}/utilization.txt
            hardware/build/${{ matrix.variant }}/nextpnr.log
